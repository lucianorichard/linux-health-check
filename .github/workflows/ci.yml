name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Unit and CLI tests
        run: python -m unittest discover -s tests -t . -v
      - name: Sample systems give the documented exit codes
        run: |
          linux-health-check -c examples/config.example.json --fixture examples/healthy --no-color
          set +e
          linux-health-check -c examples/config.example.json --fixture examples/degraded --no-color
          test $? -eq 2
      - name: Smoke test on the runner itself (any status is fine, only crashes fail)
        run: |
          set +e
          linux-health-check -s ssh.service -p 22 --json > report.json
          code=$?
          python -c "import json; r = json.load(open('report.json')); print(r['overall'])"
          test $code -le 3

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .
